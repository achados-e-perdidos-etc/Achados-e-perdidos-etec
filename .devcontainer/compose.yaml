services:
  site:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    environment:
      ETEC_CODESPACES_TESTE: "1"
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: etec
      POSTGRES_PASSWORD: etec-apenas-testes
      POSTGRES_DB: achados_testes
    volumes:
      - banco-testes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etec -d achados_testes"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  banco-testes:
