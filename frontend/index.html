<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal do Aluno - Achados e Perdidos ETEC</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme min-h-screen flex flex-col bg-[#0d1117] text-gray-200">

    <!-- Container de Notificações Toast -->
    <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Cabeçalho Principal -->
    <header class="bg-[#161b22] border-b border-[#30363d] p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center text-white font-black shadow-lg">
                    <i class="fas fa-search"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">ETEC Achados e Perdidos</h1>
                    <p class="text-[10px] text-gray-400">Portal do Aluno</p>
                </div>
            </div>
            <button onclick="abrirChatAluno()" class="relative px-3 py-2 rounded-xl bg-[#21262d] border border-[#30363d] text-xs font-bold text-gray-300 hover:text-white transition">
                <i class="fas fa-comments text-blue-400 mr-1"></i> Falar com Secretaria
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 flex-grow space-y-6">
        
        <!-- Barra de Pesquisa -->
        <section class="space-y-3">
            <div class="relative w-full">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="filtrarItensAluno()" placeholder="Buscar por objeto, cor, marca..." class="w-full bg-[#161b22] border border-[#30363d] text-white text-sm rounded-xl pl-10 pr-4 py-3.5 focus:outline-none focus:border-red-500 transition shadow-sm">
            </div>
            
            <div class="flex gap-2 overflow-x-auto scrollbar-none pb-2" id="categoriasFiltro">
                <!-- Preenchido via JS -->
            </div>
        </section>

        <!-- Grade de Itens -->
        <section>
            <h2 class="text-xs font-bold uppercase text-gray-500 mb-3 tracking-wider"><i class="fas fa-box-open mr-2"></i>Itens Disponíveis para Retirada</h2>
            <div id="listaItens" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <!-- Itens carregados via JS -->
            </div>
        </section>

    </main>

    <!-- MODAL DE DETALHES DO ITEM PARA O ALUNO -->
    <div id="modalDetalhesItem" class="hidden fixed inset-0 z-[150] bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
        <div class="bg-[#161b22] border-t sm:border border-[#30363d] w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-white text-lg"><i class="fas fa-info-circle text-blue-500 mr-2"></i>Informações do Objeto</h3>
                <button onclick="fecharModalDetalhes()" class="text-gray-500 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="bg-[#0d1117] p-3 rounded-xl border border-[#30363d] space-y-3">
                <div id="alunoItemGaleria" class="flex gap-2 overflow-x-auto scrollbar-none pb-1"></div>
                <div class="min-w-0">
                    <span id="alunoItemCat" class="text-[9px] font-bold bg-gray-800 text-gray-300 px-2 py-0.5 rounded uppercase border border-gray-600 mb-1 inline-block"></span>
                    <h4 id="alunoItemTitulo" class="font-bold text-lg text-white"></h4>
                </div>
            </div>

            <div class="space-y-2 text-sm text-gray-300 bg-[#21262d] p-4 rounded-xl border border-[#30363d]">
                <p><span class="text-gray-500 font-bold text-xs uppercase block mb-0.5">Descrição:</span> <span id="alunoItemDesc"></span></p>
                <p class="mt-2"><span class="text-gray-500 font-bold text-xs uppercase block mb-0.5">Data que foi achado:</span> <span id="alunoItemData"></span></p>
                <p class="mt-2"><span class="text-gray-500 font-bold text-xs uppercase block mb-0.5">Local onde foi achado:</span> <span id="alunoItemLocal"></span></p>
            </div>

            <div class="pt-4 border-t border-[#30363d]">
                <button id="btnReivindicar" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-bold transition text-sm flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-hand-paper"></i> É meu! Quero reivindicar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DO CHAT (ATENDIMENTO SECRETARIA) -->
    <div id="modalChatAluno" class="hidden fixed inset-0 z-[200] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#161b22] border border-[#30363d] w-full max-w-md rounded-2xl shadow-2xl flex flex-col h-[85vh] sm:h-[600px] overflow-hidden">
            
            <div class="bg-[#0f172a] p-4 flex justify-between items-center border-b border-[#30363d]">
                <div>
                    <h3 class="font-bold text-white"><i class="fas fa-headset text-blue-500 mr-2"></i>Atendimento</h3>
                    <p class="text-[10px] text-gray-400">Fale direto com a secretaria</p>
                </div>
                <button onclick="fecharChatAluno()" class="text-gray-500 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            </div>

            <!-- Identificação inicial -->
            <div id="chatLoginStep" class="p-6 flex-grow flex flex-col justify-center space-y-4">
                <div class="text-center mb-4">
                    <div class="w-16 h-16 rounded-full bg-blue-900/40 border border-blue-500 flex items-center justify-center text-blue-400 text-2xl mx-auto mb-3">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h4 class="font-bold text-white">Identifique-se</h4>
                    <p class="text-xs text-gray-400 mt-1">Para iniciar o chat ou solicitar um item.</p>
                </div>
                <div>
                    <input type="text" id="chatAlunoNome" placeholder="Seu nome completo" class="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 mb-3">
                    <input type="number" id="chatAlunoRm" placeholder="Seu RM (Somente números)" class="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="iniciarSessaoChat()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg mt-2">
                    Acessar Chat
                </button>
            </div>

            <!-- Interface de Mensagens -->
            <div id="chatMessagesStep" class="hidden flex-col h-full">
                <div id="chatMensagensContainer" class="flex-grow overflow-y-auto p-4 space-y-3 bg-[#0d1117] scrollbar-none">
                    <!-- Mensagens inseridas via JS -->
                </div>
                <form onsubmit="enviarMensagemAluno(event)" class="p-3 bg-[#161b22] border-t border-[#30363d] flex gap-2">
                    <input type="text" id="chatInputMsg" placeholder="Digite sua mensagem..." autocomplete="off" class="flex-grow bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-xl font-bold transition shadow-md">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script>
        const API_URL = ""; 
        let itensEstoque = [];
        let categoriasAtuais = [];
        let categoriaAtiva = 'TODAS';
        
        let alunoLogado = { nome: '', rm: '' };
        let pollTimerChat = null;

        function mostrarToast(mensagem, tipo = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let icone = tipo === 'success' ? 'fa-check-circle text-emerald-400' : 'fa-info-circle text-blue-400';
            let bgClass = tipo === 'success' ? 'border-emerald-500 bg-emerald-900/40 text-emerald-100' : 'border-[#30363d] bg-[#161b22] text-white';
            
            toast.className = `border px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 toast-enter min-w-[280px] max-w-sm ${bgClass}`;
            toast.innerHTML = `<i class="fas ${icone} text-lg"></i><p class="text-sm font-semibold flex-grow">${mensagem}</p>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // --- INICIALIZAÇÃO PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('PWA Service Worker Registrado para o Portal do Aluno!', reg.scope))
                    .catch((err) => console.error('Falha ao registrar PWA:', err));
            });
        }

        // --- CARREGAMENTO DO ESTOQUE ---
        async function carregarItens() {
            try {
                const res = await fetch(`${API_URL}/api/itens`);
                if (res.ok) {
                    const dados = await res.json();
                    // O portal do aluno SÓ mostra itens com status DISPONÍVEL
                    itensEstoque = dados.filter(i => (i.status || 'DISPONÍVEL').toUpperCase() === 'DISPONÍVEL');
                    extrairCategorias();
                    filtrarItensAluno();
                }
            } catch (e) {
                console.error("Erro ao puxar itens", e);
            }
        }

        function extrairCategorias() {
            const setCats = new Set();
            itensEstoque.forEach(i => setCats.add(i.categoria || 'OUTROS'));
            categoriasAtuais = ['TODAS', ...Array.from(setCats)];
            renderizarFiltroCategorias();
        }

        function renderizarFiltroCategorias() {
            const container = document.getElementById('categoriasFiltro');
            container.innerHTML = '';
            categoriasAtuais.forEach(c => {
                const btn = document.createElement('button');
                const ativo = c === categoriaAtiva;
                btn.className = `whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold border transition ${ativo ? 'bg-red-600 border-red-500 text-white' : 'bg-[#161b22] border-[#30363d] text-gray-400 hover:text-white'}`;
                btn.innerText = c;
                btn.onclick = () => { categoriaAtiva = c; filtrarItensAluno(); renderizarFiltroCategorias(); };
                container.appendChild(btn);
            });
        }

        function filtrarItensAluno() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            let filtrados = itensEstoque;

            if (categoriaAtiva !== 'TODAS') {
                filtrados = filtrados.filter(i => i.categoria === categoriaAtiva);
            }

            if (termo) {
                filtrados = filtrados.filter(i => 
                    (i.nome || '').toLowerCase().includes(termo) || 
                    (i.txt_descricao || '').toLowerCase().includes(termo)
                );
            }

            renderizarGrade(filtrados);
        }

        function renderizarGrade(lista) {
            const container = document.getElementById('listaItens');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10"><i class="fas fa-box-open text-4xl text-[#30363d] mb-3"></i><p class="text-gray-500 text-sm">Nenhum item disponível encontrado.</p></div>`;
                return;
            }

            lista.forEach(item => {
                const foto = item.fotos && item.fotos.length > 0 ? item.fotos[0] : '';
                const imgHTML = foto ? `<img src="${foto}" class="w-full h-32 object-cover">` : `<div class="w-full h-32 bg-[#21262d] flex items-center justify-center text-gray-600"><i class="fas fa-camera text-2xl"></i></div>`;
                
                const card = document.createElement('div');
                card.className = "bg-[#161b22] border border-[#30363d] rounded-2xl overflow-hidden cursor-pointer hover:border-gray-500 transition shadow-sm flex flex-col";
                card.onclick = () => abrirDetalhesItem(item.id);

                card.innerHTML = `
                    ${imgHTML}
                    <div class="p-3 flex-grow flex flex-col justify-between">
                        <div>
                            <span class="text-[8px] font-bold bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded uppercase border border-gray-700">${item.categoria}</span>
                            <h4 class="font-bold text-sm text-white mt-1 line-clamp-2">${item.nome || item.txt_descricao}</h4>
                        </div>
                        <p class="text-[9px] text-gray-500 mt-2"><i class="fas fa-calendar-alt"></i> ${item.txt_data.split(' ')[0]}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function abrirDetalhesItem(id) {
            const item = itensEstoque.find(i => i.id === id);
            if (!item) return;

            const galeria = document.getElementById('alunoItemGaleria');
            galeria.innerHTML = '';
            const fotosArray = item.fotos || [];
            
            if (fotosArray.length > 0) {
                fotosArray.forEach(f => { galeria.innerHTML += `<img src="${f}" class="w-24 h-24 object-cover rounded-xl shrink-0 border border-[#30363d]">`; });
            } else {
                galeria.innerHTML = `<div class="w-24 h-24 bg-[#21262d] rounded-xl border border-[#30363d] flex items-center justify-center shrink-0"><i class="fas fa-box text-2xl text-gray-600"></i></div>`;
            }

            document.getElementById('alunoItemCat').innerText = item.categoria;
            document.getElementById('alunoItemTitulo').innerText = item.nome || item.txt_descricao;
            document.getElementById('alunoItemDesc').innerText = item.txt_descricao;
            document.getElementById('alunoItemData').innerText = item.txt_data;
            document.getElementById('alunoItemLocal').innerText = item.txt_local;

            // O botão de reivindicar leva direto para o CHAT com a mensagem pronta
            document.getElementById('btnReivindicar').onclick = () => {
                fecharModalDetalhes();
                abrirChatAluno(`Olá Secretaria! Gostaria de reivindicar o objeto #${item.id} (${item.nome || 'Sem título'}). O objeto é meu e posso comprovar.`);
            };

            document.getElementById('modalDetalhesItem').classList.remove('hidden');
        }

        function fecharModalDetalhes() { document.getElementById('modalDetalhesItem').classList.add('hidden'); }

        // --- SISTEMA DE CHAT (ALUNO) ---
        function abrirChatAluno(msgInicial = "") {
            document.getElementById('modalChatAluno').classList.remove('hidden');
            
            if (alunoLogado.rm) {
                document.getElementById('chatLoginStep').classList.add('hidden');
                document.getElementById('chatMessagesStep').classList.remove('hidden');
                document.getElementById('chatMessagesStep').classList.add('flex');
                
                if (msgInicial) {
                    document.getElementById('chatInputMsg').value = msgInicial;
                }
                atualizarMensagens();
                iniciarPollingChat();
            } else {
                document.getElementById('chatLoginStep').classList.remove('hidden');
                document.getElementById('chatMessagesStep').classList.add('hidden');
                document.getElementById('chatMessagesStep').classList.remove('flex');
                
                // Salva a mensagem inicial temporalmente na sessionStorage para mandar pós-login
                if (msgInicial) sessionStorage.setItem('msgPendente', msgInicial);
            }
        }

        function fecharChatAluno() {
            document.getElementById('modalChatAluno').classList.add('hidden');
            pararPollingChat();
        }

        function iniciarSessaoChat() {
            const n = document.getElementById('chatAlunoNome').value.trim();
            const r = document.getElementById('chatAlunoRm').value.trim();

            if (!n || !r) {
                mostrarToast("Por favor, preencha Nome e RM corretos.", "error");
                return;
            }

            alunoLogado = { nome: n, rm: r };
            document.getElementById('chatLoginStep').classList.add('hidden');
            document.getElementById('chatMessagesStep').classList.remove('hidden');
            document.getElementById('chatMessagesStep').classList.add('flex');
            
            const msgPendente = sessionStorage.getItem('msgPendente');
            if (msgPendente) {
                document.getElementById('chatInputMsg').value = msgPendente;
                sessionStorage.removeItem('msgPendente');
            }

            atualizarMensagens();
            iniciarPollingChat();
        }

        async function atualizarMensagens() {
            if (!alunoLogado.rm) return;
            try {
                // Origem ALUNO marca como lidas as mensagens vindas da SECRETARIA
                const res = await fetch(`${API_URL}/api/chat/mensagens/${alunoLogado.rm}?marcar_lida=true&origem=ALUNO`);
                if (res.ok) {
                    const msgs = await res.json();
                    const container = document.getElementById('chatMensagensContainer');
                    container.innerHTML = '';
                    
                    if(msgs.length === 0){
                        container.innerHTML = `<p class="text-center text-xs text-gray-500 mt-10">Envie uma mensagem para a secretaria. Ela responderá assim que possível.</p>`;
                        return;
                    }

                    msgs.forEach(m => {
                        const souEu = m.remetente === 'ALUNO';
                        const div = document.createElement('div');
                        div.className = `flex flex-col ${souEu ? 'items-end' : 'items-start'}`;
                        const balao = souEu ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-[#21262d] border border-[#30363d] text-gray-200 rounded-tl-none';
                        div.innerHTML = `
                            <span class="text-[9px] text-gray-500 mb-0.5">${souEu ? 'Você' : 'Secretaria ETEC'} • ${m.data_envio.split(' ')[1] || ''}</span>
                            <div class="max-w-[85%] px-4 py-2.5 rounded-2xl ${balao} shadow-sm break-words text-sm">${m.mensagem}</div>
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) { console.error(e); }
        }

        async function enviarMensagemAluno(e) {
            e.preventDefault();
            const input = document.getElementById('chatInputMsg');
            const txt = input.value.trim();
            if (!txt || !alunoLogado.rm) return;

            const payload = {
                rm: alunoLogado.rm,
                nome: alunoLogado.nome,
                remetente: 'ALUNO',
                mensagem: txt
            };

            try {
                const res = await fetch(`${API_URL}/api/chat/enviar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    input.value = '';
                    atualizarMensagens();
                }
            } catch (e) { mostrarToast("Erro ao conectar", "error"); }
        }

        function iniciarPollingChat() {
            pararPollingChat();
            pollTimerChat = setInterval(atualizarMensagens, 3000);
        }

        function pararPollingChat() {
            if (pollTimerChat) { clearInterval(pollTimerChat); pollTimerChat = null; }
        }

        window.onload = carregarItens;
    </script>
</body>
</html>
