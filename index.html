<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados ETEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#0d1117',
                        card: '#161b22',
                        header: '#21262d',
                        border: '#30363d',
                        main: '#c9d1d9',
                        muted: '#8b949e',
                        accent: '#e53e3e'
                    }
                }
            }
        }
    </script>
    <style>
        .sliding-pill {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #e53e3e;
        }
    </style>
</head>
<body class="bg-bg text-main min-h-screen font-sans flex flex-col items-center p-4 sm:p-6">

    <!-- CABEÇALHO DA PÁGINA -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center bg-card border border-color rounded-2xl p-4 sm:p-6 mb-6 shadow-lg gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-accent/10 text-accent p-3 rounded-xl border border-accent/20">
                <i class="fas fa-boxes text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">Achados ETEC</h1>
                <p class="text-xs text-muted">Catálogo Digital de Objetos Encontrados</p>
            </div>
        </div>
        
        <!-- BARRA DE PESQUISA -->
        <div class="relative w-full sm:w-72">
            <input type="text" id="searchInput" oninput="filtrarBusca(this.value)" placeholder="Pesquisar objeto..." 
                   class="w-full bg-header border border-color text-main placeholder-muted text-xs rounded-xl pl-9 pr-4 py-2.5 focus:outline-none focus:border-accent transition">
            <i class="fas fa-search absolute left-3 top-3 text-muted text-xs"></i>
        </div>
    </header>

    <!-- CONTAINER DE FILTROS -->
    <main class="w-full max-w-4xl space-y-6">
        <section class="bg-card border border-color rounded-2xl p-4 sm:p-6 shadow-lg space-y-4">
            
            <!-- CATEGORIAS -->
            <div>
                <h3 class="text-xs font-bold uppercase text-muted mb-3 tracking-wider">Filtrar por Categoria:</h3>
                <div id="categoryContainer" class="relative flex flex-wrap gap-2 p-1">
                    <div id="catIndicator" class="sliding-pill absolute rounded-full z-0 opacity-0"></div>

                    <button onclick="filtrarCategoria('TODOS', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-white border border-transparent transition-colors duration-200">TODOS</button>
                    <button onclick="filtrarCategoria('MOCHILA', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">MOCHILA</button>
                    <button onclick="filtrarCategoria('ROUPAS', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">ROUPAS</button>
                    <button onclick="filtrarCategoria('ACESSÓRIOS', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">ACESSÓRIOS</button>
                    <button onclick="filtrarCategoria('ESCOLARES', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">ESCOLARES</button>
                </div>
            </div>

            <hr class="border-color">

            <!-- FILTRO DE STATUS -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <h3 class="text-xs font-bold uppercase text-muted tracking-wider">Status do Objeto:</h3>
                <select id="statusFilter" onchange="filtrarStatus(this.value)" class="bg-header border border-color text-main text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-accent transition cursor-pointer">
                    <option value="TODOS">TODOS OS STATUS</option>
                    <option value="GUARDADO">GUARDADO / DISPONÍVEL</option>
                    <option value="SOLICITADO">SOLICITADO</option>
                    <option value="ENTREGUE">ENTREGUE</option>
                </select>
            </div>
        </section>

        <!-- GRID DE EXIBIÇÃO DOS ITENS -->
        <section id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Cards gerados dinamicamente via JS -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
