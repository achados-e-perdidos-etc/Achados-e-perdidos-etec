<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETEC - Achados e Perdidos (Alunos)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .green-button { background-color: #238636; color: #ffffff; transition: all 0.2s; }
        .green-button:hover { background-color: #2ea043; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <script>
        const API_URL = "https://achados-etec-api.onrender.com";
    </script>

    <!-- CABEÇALHO -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-green-600 text-white p-2.5 rounded-full">
                    <i class="fas fa-search-location text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-green-400 leading-tight">ACHADOS E PERDIDOS</h1>
                    <p class="text-xs text-gray-400">ETEC PROFº JOSÉ IGNÁCIO AZEVEDO FILHO</p>
                </div>
            </div>
            <div id="userInfo" class="hidden text-right">
                <span id="userName" class="block font-bold text-sm text-green-400"></span>
                <span id="userRM" class="text-xs text-gray-400"></span>
                <button onclick="logout()" class="text-xs text-red-400 underline block mt-1">Sair</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 flex-grow">

        <!-- TELA DE LOGIN -->
        <section id="loginScreen" class="max-w-md mx-auto my-8 bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
            <div class="text-center mb-6">
                <i class="fas fa-user-graduate text-5xl text-green-500 mb-3"></i>
                <h2 class="text-xl font-bold">PORTAL DO ALUNO</h2>
                <p class="text-sm text-gray-400">Entre com Nome e RM para consultar os objetos</p>
            </div>

            <form id="formLogin" onsubmit="realizarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">NOME DE USUÁRIO:</label>
                    <input type="text" id="inputNome" placeholder="Seu nome" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">RM:</label>
                    <input type="text" id="inputRM" placeholder="Seu número de RM" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-green-500">
                </div>

                <button type="submit" class="w-full green-button font-bold py-3 rounded-lg text-sm uppercase">
                    ACESSAR O SISTEMA
                </button>
            </form>
        </section>

        <!-- CATÁLOGO DE OBJETOS -->
        <section id="catalogScreen" class="hidden space-y-6">
            <div>
                <h3 class="text-xs font-bold uppercase text-gray-400 mb-3">FILTRAR POR CATEGORIA:</h3>
                <div class="flex flex-wrap gap-2">
                    <button onclick="filtrarCategoria('TODOS')" class="cat-btn bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold">TODOS</button>
                    <button onclick="filtrarCategoria('MOCHILA')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-2 rounded-full text-xs font-bold">MOCHILA</button>
                    <button onclick="filtrarCategoria('ROUPAS')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-2 rounded-full text-xs font-bold">ROUPAS</button>
                    <button onclick="filtrarCategoria('ACESSÓRIOS')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-2 rounded-full text-xs font-bold">ACESSÓRIOS</button>
                    <button onclick="filtrarCategoria('ESCOLARES')" class="cat-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-4 py-2 rounded-full text-xs font-bold">ESCOLARES</button>
                </div>
            </div>

            <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- TELA DETALHADA -->
        <section id="detailScreen" class="hidden max-w-lg mx-auto bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <button onclick="voltarParaCatalogo()" class="text-xs text-gray-400 hover:text-white mb-4"><i class="fas fa-arrow-left"></i> Voltar ao catálogo</button>

            <h2 class="text-xs font-bold text-green-400 uppercase mb-2">INFORMAÇÕES DO ITEM</h2>

            <div class="bg-black rounded-xl overflow-hidden mb-4 border border-gray-800 h-64 flex items-center justify-center">
                <img id="detailImage" src="" class="max-h-full object-contain hidden">
                <div id="detailPlaceholder" class="text-center p-6 text-gray-500">
                    <i class="fas fa-box-open text-5xl mb-2"></i>
                    <p class="text-xs">Foto mantida no registro da secretaria</p>
                </div>
            </div>

            <div class="space-y-3">
                <h3 id="detailTitle" class="text-2xl font-black text-white"></h3>
                <p id="detailDescription" class="text-sm text-gray-300 bg-gray-800/40 p-3 rounded-lg border border-gray-800"></p>

                <div class="flex justify-between items-center text-xs text-gray-400 pt-2 border-t border-gray-800">
                    <span>Local: <strong id="detailLocal" class="text-gray-200"></strong></span>
                    <span>Data: <strong id="detailDate" class="text-gray-200"></strong></span>
                </div>

                <div class="pt-4">
                    <button id="btnSolicitar" onclick="solicitarColeta()" class="w-full green-button font-bold py-3.5 rounded-xl text-sm uppercase">
                        ESTE É O MEU ITEM / SOLICITAR COLETA
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        let alunoLogado = null;
        let todosItens = [];
        let itemSelecionado = null;
        let categoriaAtual = 'TODOS';

        async function carregarItensDaAPI() {
            try {
                const response = await fetch(`${API_URL}/api/itens`);
                if (response.ok) {
                    todosItens = await response.json();
                    renderizarItens();
                }
            } catch (error) {
                console.error("Erro ao carregar dados do Neon PostgreSQL", error);
            }
        }

        function realizarLogin(e) {
            e.preventDefault();
            alunoLogado = {
                nome: document.getElementById('inputNome').value.trim(),
                rm: document.getElementById('inputRM').value.trim()
            };

            document.getElementById('userName').innerText = alunoLogado.nome;
            document.getElementById('userRM').innerText = `RM: ${alunoLogado.rm}`;
            document.getElementById('userInfo').classList.remove('hidden');

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('catalogScreen').classList.remove('hidden');

            carregarItensDaAPI();
        }

        function logout() {
            alunoLogado = null;
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('catalogScreen').classList.add('hidden');
            document.getElementById('detailScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function filtrarCategoria(cat) {
            categoriaAtual = cat;
            renderizarItens();
        }

        function renderizarItens() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            const filtrados = categoriaAtual === 'TODOS' 
                ? todosItens 
                : todosItens.filter(i => i.categoria.toUpperCase() === categoriaAtual);

            if (filtrados.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 py-8">Nenhum objeto cadastrado nesta categoria.</div>';
                return;
            }

            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col justify-between cursor-pointer hover:border-green-500 transition";
                card.onclick = () => abrirDetalhes(item);

                const imgHtml = item.foto 
                    ? `<img src="${item.foto}" class="w-full h-32 object-cover rounded-lg mb-3">`
                    : `<div class="w-full h-32 bg-gray-800 rounded-lg mb-3 flex items-center justify-center text-gray-600"><i class="fas fa-box text-3xl"></i></div>`;

                card.innerHTML = `
                    <div>
                        ${imgHtml}
                        <span class="text-[10px] font-bold bg-green-950 text-green-400 border border-green-800 px-2 py-0.5 rounded uppercase">${item.categoria}</span>
                        <h4 class="font-bold text-base mt-2 text-white">${item.txt_descricao}</h4>
                        <p class="text-xs text-gray-400 mt-1"><i class="fas fa-map-marker-alt"></i> ${item.txt_local}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirDetalhes(item) {
            itemSelecionado = item;
            document.getElementById('catalogScreen').classList.add('hidden');
            document.getElementById('detailScreen').classList.remove('hidden');

            document.getElementById('detailTitle').innerText = item.categoria;
            document.getElementById('detailDescription').innerText = item.txt_descricao;
            document.getElementById('detailLocal').innerText = item.txt_local;
            document.getElementById('detailDate').innerText = item.txt_data;

            const imgEl = document.getElementById('detailImage');
            const placeholder = document.getElementById('detailPlaceholder');

            if (item.foto) {
                imgEl.src = item.foto;
                imgEl.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        function voltarParaCatalogo() {
            document.getElementById('detailScreen').classList.add('hidden');
            document.getElementById('catalogScreen').classList.remove('hidden');
        }

        async function solicitarColeta() {
            if (!itemSelecionado || !alunoLogado) return;

            const response = await fetch(`${API_URL}/api/solicitar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: itemSelecionado.id,
                    nome: alunoLogado.nome,
                    rm: alunoLogado.rm
                })
            });

            const res = await response.json();
            alert(res.message);
            voltarParaCatalogo();
            carregarItensDaAPI();
        }
    </script>
</body>
</html>
