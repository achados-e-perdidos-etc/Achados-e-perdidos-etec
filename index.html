<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETEC - Achados e Perdidos (Alunos)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Variáveis de Cores Primárias Dinâmicas (Padrão: Vermelho ETEC) */
        :root {
            --primary-color: #dc2626;
            --primary-hover: #b91c1c;
            --primary-text: #f87171;
            --primary-bg-subtle: #450a0a;
            --primary-border: #991b1b;
        }

        /* Tema Escuro (Padrão) */
        body.dark-theme {
            background-color: #0d1117;
            color: #e6edf3;
        }
        .dark-theme .bg-card { background-color: #161b22; }
        .dark-theme .bg-header { background-color: #161b22; }
        .dark-theme .border-color { border-color: #30363d; }
        .dark-theme .text-muted { color: #8b949e; }
        .dark-theme .text-main { color: #ffffff; }

        /* Tema Claro */
        body.light-theme {
            background-color: #f6f8fa;
            color: #1f2328;
        }
        .light-theme .bg-card { background-color: #ffffff; }
        .light-theme .bg-header { background-color: #ffffff; }
        .light-theme .border-color { border-color: #d0d7de; }
        .light-theme .text-muted { color: #636c76; }
        .light-theme .text-main { color: #1f2328; }

        /* Botão Primário Dinâmico */
        .dynamic-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            transition: background-color 0.2s;
        }
        .dynamic-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Indicador Deslizante de Categoria */
        .sliding-pill {
            background-color: var(--primary-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Texto de Destaque Dinâmico */
        .dynamic-text {
            color: var(--primary-text);
        }

        /* Badge Dinâmico */
        .dynamic-badge {
            background-color: var(--primary-bg-subtle);
            color: var(--primary-text);
            border: 1px solid var(--primary-border);
        }
    </style>
</head>
<body class="dark-theme min-h-screen flex flex-col justify-between">

    <script>
        const API_URL = "https://achados-etec-api.onrender.com";
    </script>

    <!-- CABEÇALHO -->
    <header class="bg-header border-b border-color p-4 sticky top-0 z-50 transition-colors">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="Logo.png" alt="Logo Achados e Perdidos" class="w-10 h-10 object-cover rounded-full">
                <div>
                    <h1 class="font-bold text-lg dynamic-text leading-tight">ACHADOS E PERDIDOS</h1>
                    <p class="text-xs text-muted">ETEC PROFº JOSÉ IGNÁCIO AZEVEDO FILHO</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- PAINEL DE CONFIGURAÇÕES DE TEMA E COR -->
                <div class="relative">
                    <button onclick="toggleConfigMenu()" class="p-2 rounded-lg bg-card border border-color text-muted hover:text-main transition" title="Configurações de Aparência">
                        <i class="fas fa-cog text-base"></i>
                    </button>

                    <!-- MENU DROPDOWN DE CONFIGURAÇÕES -->
                    <div id="configMenu" class="hidden absolute right-0 mt-2 w-60 bg-card border border-color rounded-xl shadow-2xl p-3 z-50 space-y-3">
                        <div>
                            <span class="text-[11px] font-bold uppercase text-muted block mb-1">Modo de Exibição</span>
                            <button onclick="alternarModoEscuroClaro()" class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-header border border-color text-xs text-main hover:opacity-80 transition">
                                <span id="themeLabel">Modo Escuro</span>
                                <i id="themeIcon" class="fas fa-moon text-yellow-400"></i>
                            </button>
                        </div>

                        <hr class="border-color">

                        <div>
                            <span class="text-[11px] font-bold uppercase text-muted block mb-1">Cor do Estilo</span>
                            <div class="grid grid-cols-4 gap-2 pt-1">
                                <button onclick="mudarEstiloCor('vermelho')" class="h-8 rounded-lg bg-red-600 border border-red-400 flex items-center justify-center text-white" title="Vermelho ETEC">
                                    <i class="fas fa-check text-xs hidden" id="check-vermelho"></i>
                                </button>
                                <button onclick="mudarEstiloCor('verde')" class="h-8 rounded-lg bg-green-600 border border-green-400 flex items-center justify-center text-white" title="Verde ETEC">
                                    <i class="fas fa-check text-xs hidden" id="check-verde"></i>
                                </button>
                                <button onclick="mudarEstiloCor('azul')" class="h-8 rounded-lg bg-blue-600 border border-blue-400 flex items-center justify-center text-white" title="Azul Tecnológico">
                                    <i class="fas fa-check text-xs hidden" id="check-azul"></i>
                                </button>
                                <button onclick="mudarEstiloCor('roxo')" class="h-8 rounded-lg bg-purple-600 border border-purple-400 flex items-center justify-center text-white" title="Roxo Cyber">
                                    <i class="fas fa-check text-xs hidden" id="check-roxo"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="userInfo" class="hidden text-right">
                    <span id="userName" class="block font-bold text-sm dynamic-text"></span>
                    <span id="userRM" class="text-xs text-muted"></span>
                    <button onclick="logout()" class="text-xs text-red-400 underline block mt-1">Sair</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 flex-grow">

        <!-- CATÁLOGO DE OBJETOS -->
        <section id="catalogScreen" class="space-y-6">
            <div>
                <h3 class="text-xs font-bold uppercase text-muted mb-3">FILTRAR POR CATEGORIA:</h3>
                
                <!-- CONTAINER DE CATEGORIAS COM SLIDER DE ANIMAÇÃO -->
                <div id="categoryContainer" class="relative flex flex-wrap gap-2 p-1">
                    <!-- Fundo animado deslizante -->
                    <div id="catIndicator" class="sliding-pill absolute rounded-full pointer-events-none z-0"></div>

                    <!-- Botões de Categoria -->
                    <button onclick="filtrarCategoria('TODOS', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-white border border-transparent transition-colors duration-200">TODOS</button>
                    <button onclick="filtrarCategoria('MOCHILA', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">MOCHILA</button>
                    <button onclick="filtrarCategoria('ROUPAS', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">ROUPAS</button>
                    <button onclick="filtrarCategoria('ACESSÓRIOS', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">ACESSÓRIOS</button>
                    <button onclick="filtrarCategoria('ESCOLARES', this)" class="cat-btn relative z-10 px-4 py-2 rounded-full text-xs font-bold text-muted hover:text-main border border-color bg-card transition-colors duration-200">ESCOLARES</button>
                </div>
            </div>

            <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- TELA DETALHADA -->
        <section id="detailScreen" class="hidden max-w-lg mx-auto bg-card border border-color rounded-2xl p-6">
            <button onclick="voltarParaCatalogo()" class="text-xs text-muted hover:text-main mb-4"><i class="fas fa-arrow-left"></i> Voltar ao catálogo</button>

            <h2 class="text-xs font-bold dynamic-text uppercase mb-2">INFORMAÇÕES DO ITEM</h2>

            <div class="bg-black/20 rounded-xl overflow-hidden mb-4 border border-color h-64 flex items-center justify-center">
                <img id="detailImage" src="" class="max-h-full object-contain hidden">
                <div id="detailPlaceholder" class="text-center p-6 text-muted">
                    <i class="fas fa-box-open text-5xl mb-2"></i>
                    <p class="text-xs">Foto mantida no registro da secretaria</p>
                </div>
            </div>

            <div class="space-y-3">
                <h3 id="detailTitle" class="text-2xl font-black text-main"></h3>
                <p id="detailDescription" class="text-sm text-muted bg-header p-3 rounded-lg border border-color"></p>

                <div class="flex justify-between items-center text-xs text-muted pt-2 border-t border-color">
                    <span>Local: <strong id="detailLocal" class="text-main"></strong></span>
                    <span>Data: <strong id="detailDate" class="text-main"></strong></span>
                </div>

                <div class="pt-4">
                    <button id="btnSolicitar" onclick="solicitarColeta()" class="w-full dynamic-btn font-bold py-3.5 rounded-xl text-sm uppercase">
                        ESTE É O MEU ITEM / SOLICITAR COLETA
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        let alunoLogado = null;
        let todosItens = [];
        let itemSelecionado = null;
        let categoriaAtual = 'TODOS';

        // --- SISTEMA DE TEMA E CORES ---
        function toggleConfigMenu() {
            const menu = document.getElementById('configMenu');
            menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('configMenu');
            const btn = e.target.closest('button');
            if (!menu.contains(e.target) && (!btn || !btn.getAttribute('onclick')?.includes('toggleConfigMenu'))) {
                menu.classList.add('hidden');
            }
        });

        function alternarModoEscuroClaro() {
            const isDark = document.body.classList.contains('dark-theme');
            if (isDark) {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
                document.getElementById('themeLabel').innerText = "Modo Claro";
                document.getElementById('themeIcon').className = "fas fa-sun text-yellow-500";
                localStorage.setItem('theme_mode', 'light');
            } else {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                document.getElementById('themeLabel').innerText = "Modo Escuro";
                document.getElementById('themeIcon').className = "fas fa-moon text-yellow-400";
                localStorage.setItem('theme_mode', 'dark');
            }
        }

        const temasCores = {
            vermelho: {
                primary: '#dc2626',
                hover: '#b91c1c',
                text: '#f87171',
                subtle: '#450a0a',
                border: '#991b1b'
            },
            verde: {
                primary: '#238636',
                hover: '#2ea043',
                text: '#4ade80',
                subtle: '#052e16',
                border: '#14532d'
            },
            azul: {
                primary: '#0284c7',
                hover: '#0369a1',
                text: '#38bdf8',
                subtle: '#0c4a6e',
                border: '#0369a1'
            },
            roxo: {
                primary: '#9333ea',
                hover: '#7e22ce',
                text: '#c084fc',
                subtle: '#3b0764',
                border: '#6b21a8'
            }
        };

        function mudarEstiloCor(cor) {
            const tema = temasCores[cor] || temasCores.vermelho;
            const root = document.documentElement;

            root.style.setProperty('--primary-color', tema.primary);
            root.style.setProperty('--primary-hover', tema.hover);
            root.style.setProperty('--primary-text', tema.text);
            root.style.setProperty('--primary-bg-subtle', tema.subtle);
            root.style.setProperty('--primary-border', tema.border);

            document.querySelectorAll('#configMenu i[id^="check-"]').forEach(el => el.classList.add('hidden'));
            const check = document.getElementById(`check-${cor}`);
            if (check) check.classList.remove('hidden');

            localStorage.setItem('theme_color', cor);
        }

        function carregarPreferenciasAparencia() {
            const modoSalvo = localStorage.getItem('theme_mode') || 'dark';
            if (modoSalvo === 'light') {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
                document.getElementById('themeLabel').innerText = "Modo Claro";
                document.getElementById('themeIcon').className = "fas fa-sun text-yellow-500";
            }

            const corSalva = localStorage.getItem('theme_color') || 'vermelho';
            mudarEstiloCor(corSalva);
        }

        // --- MÉTODOS DA API ---
        async function carregarItensDaAPI() {
            try {
                const response = await fetch(`${API_URL}/api/itens`);
                if (response.ok) {
                    todosItens = await response.json();
                    renderizarItens();
                }
            } catch (error) {
                console.error("Erro ao carregar dados do Neon PostgreSQL", error);
            }
        }

        function logout() {
            alunoLogado = null;
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('catalogScreen').classList.add('hidden');
            document.getElementById('detailScreen').classList.add('hidden');
        }

        // --- FILTRAGEM DE CATEGORIAS COM SLIDER ANIMADO ---
        function moveIndicator(element) {
            const indicator = document.getElementById('catIndicator');
            if (!indicator || !element) return;

            indicator.style.left = `${element.offsetLeft}px`;
            indicator.style.top = `${element.offsetTop}px`;
            indicator.style.width = `${element.offsetWidth}px`;
            indicator.style.height = `${element.offsetHeight}px`;
        }

        function filtrarCategoria(cat, btnElement) {
            categoriaAtual = cat;
            
            if (btnElement) {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('text-white', 'border-transparent');
                    b.classList.add('text-muted', 'border-color', 'bg-card');
                });

                btnElement.classList.remove('text-muted', 'border-color', 'bg-card');
                btnElement.classList.add('text-white', 'border-transparent');

                moveIndicator(btnElement);
            }

            renderizarItens();
        }

        function renderizarItens() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            const filtrados = categoriaAtual === 'TODOS' 
                ? todosItens 
                : todosItens.filter(i => i.categoria.toUpperCase() === categoriaAtual);

            if (filtrados.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-muted py-8">Nenhum objeto cadastrado nesta categoria.</div>';
                return;
            }

            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-card border border-color rounded-xl p-4 flex flex-col justify-between cursor-pointer hover:border-gray-500 transition";
                card.onclick = () => abrirDetalhes(item);

                const imgHtml = item.foto 
                    ? `<img src="${item.foto}" class="w-full h-32 object-cover rounded-lg mb-3">`
                    : `<div class="w-full h-32 bg-header border border-color rounded-lg mb-3 flex items-center justify-center text-muted"><i class="fas fa-box text-3xl"></i></div>`;

                card.innerHTML = `
                    <div>
                        ${imgHtml}
                        <span class="text-[10px] font-bold dynamic-badge px-2 py-0.5 rounded uppercase">${item.categoria}</span>
                        <h4 class="font-bold text-base mt-2 text-main">${item.txt_descricao}</h4>
                        <p class="text-xs text-muted mt-1"><i class="fas fa-map-marker-alt"></i> ${item.txt_local}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirDetalhes(item) {
            itemSelecionado = item;
            document.getElementById('catalogScreen').classList.add('hidden');
            document.getElementById('detailScreen').classList.remove('hidden');

            document.getElementById('detailTitle').innerText = item.categoria;
            document.getElementById('detailDescription').innerText = item.txt_descricao;
            document.getElementById('detailLocal').innerText = item.txt_local;
            document.getElementById('detailDate').innerText = item.txt_data;

            const imgEl = document.getElementById('detailImage');
            const placeholder = document.getElementById('detailPlaceholder');

            if (item.foto) {
                imgEl.src = item.foto;
                imgEl.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        function voltarParaCatalogo() {
            document.getElementById('detailScreen').classList.add('hidden');
            document.getElementById('catalogScreen').classList.remove('hidden');
        }

        async function solicitarColeta() {
            if (!itemSelecionado) return;

            let nomeDigitado = prompt("Por favor, digite seu Nome completo:");
            let rmDigitado = prompt("Por favor, digite seu RM:");

            if (!nomeDigitado || !rmDigitado) {
                alert("Você precisa informar seu Nome e RM para solicitar o item!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/solicitar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: itemSelecionado.id,
                        nome: nomeDigitado,
                        rm: rmDigitado
                    })
                });

                const res = await response.json();
                alert(res.message);
